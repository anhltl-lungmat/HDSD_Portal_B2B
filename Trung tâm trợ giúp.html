<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trung tâm trợ giúp · Portal B2B Baokim</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app"></div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Data layer -->
  <script src="data.js"></script>

  <!-- Components & pages -->
  <script type="text/babel" data-presets="react" src="components.jsx"></script>
  <script type="text/babel" data-presets="react" src="pages.jsx"></script>

  <!-- App shell with simple route state -->
  <script type="text/babel" data-presets="react">
    const { useState, useCallback, useEffect } = React;

    function App() {
      const [route, setRoute] = useState({ name: "home" });

      const navigate = useCallback((r) => {
        setRoute(r);
        // sync hash for shareable links
        const enc = encodeURIComponent(JSON.stringify(r));
        history.replaceState(null, "", "#r=" + enc);
        window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
      }, []);

      // Hydrate from hash on first load
      useEffect(() => {
        const m = location.hash.match(/^#r=(.+)$/);
        if (m) {
          try { setRoute(JSON.parse(decodeURIComponent(m[1]))); } catch {}
        }
      }, []);

      let page;
      switch (route.name) {
        case "group":    page = <GroupPage   groupId={route.id}  navigate={navigate} />; break;
        case "article":  page = <ArticlePage id={route.id} fromGroup={route.from} navigate={navigate} />; break;
        default:         page = <HomePage    navigate={navigate} />;
      }

      return (
        <div className="page-shell">
          <Header route={route} navigate={navigate} />
          <main key={route.name + "-" + (route.id || "")}>{page}</main>
          <Footer navigate={navigate} />
          <FloatingChat />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("app")).render(<App />);
  </script>
</body>
</html>
